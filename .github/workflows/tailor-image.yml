# Builds the Tailor app image and pushes it to Amazon ECR,
# then (optionally) tells Coolify to pull and redeploy it.
# Runs only when started by hand: Actions > Tailor image > Run workflow.
name: Tailor image

on:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job sign in to AWS with GitHub's OIDC token, so no AWS keys are stored here.
  id-token: write

env:
  AWS_REGION: ap-southeast-3
  IMAGE: 668461485330.dkr.ecr.ap-southeast-3.amazonaws.com/tailor

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # AWS_ROLE_ARN: an IAM role that trusts this repository and can push to the ECR repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Add linux/arm64 here if your Coolify server is ARM.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      # Coolify > your resource > Webhooks: the deploy URL. Token: Keys & Tokens > API tokens.
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger Coolify redeploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl --silent --show-error --fail --request POST --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK_URL }}"
